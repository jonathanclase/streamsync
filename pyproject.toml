[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamsync"
version = "0.2.0"
description = "A Python tool to evaluate two or more media files and return the appropriate offsets required to sync the audio tracks, with an option to automatically mux the files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Also requires ffmpeg and ffprobe on PATH (not installable with pip)
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
streamsync = "streamsync.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
